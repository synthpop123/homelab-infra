# sure — self-hosted personal finance (https://github.com/we-promise/sure).
# Runs on the arm host (Oracle-Arm, aarch64 — ghcr.io/we-promise/sure is multi-arch incl.
# linux/arm64), served by arm's host Caddy at sure.lkwplus.com. Only the web service publishes
# a host port (127.0.0.1:20004); Postgres and Redis are internal-only.
#
# Upstream: compose.example.yml + docs/hosting/docker.md. TLS terminates at the host Caddy, so
# RAILS_ASSUME_SSL is true. SECRET_KEY_BASE, bundled Postgres password, and Active Record
# encryption keys are Komodo Variables (generate keys with `bin/rails db:encryption:init`).
#
# Market-data config (providers + their API keys) is deliberately NOT set here: whenever the
# matching env var is present, Sure disables the corresponding control in Settings > Self
# hosting and the app can only be reconfigured by editing this file. The values live in the
# app's own `settings` table instead (API keys encrypted at rest with the AR encryption keys
# above), so providers can be switched from the UI.
services:
  sure:
    container_name: sure
    image: ghcr.io/we-promise/sure:0.7.4
    restart: unless-stopped
    depends_on:
      sure-postgres:
        condition: service_healthy
      sure-redis:
        condition: service_healthy
    ports:
      # host:container — arm registry (see docs/ports.md), loopback-only for the host Caddy
      - "127.0.0.1:20004:3000/tcp"
    volumes:
      # Rails runs as uid 1000 in the image — chown the host dir before first deploy:
      #   chown 1000:1000 /srv/sure/storage
      - /srv/sure/storage:/rails/storage
    environment:
      POSTGRES_USER: sure_user
      POSTGRES_PASSWORD: ${SURE_POSTGRES_PASSWORD}
      POSTGRES_DB: sure_production
      SECRET_KEY_BASE: ${SURE_SECRET_KEY_BASE}
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${SURE_AR_ENC_PRIMARY_KEY}
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${SURE_AR_ENC_DETERMINISTIC_KEY}
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${SURE_AR_ENC_KEY_DERIVATION_SALT}
      SNAPTRADE_OAUTH_CLIENT_ID: ${SNAPTRADE_OAUTH_CLIENT_ID}
      SNAPTRADE_OAUTH_CLIENT_SECRET: ${SNAPTRADE_OAUTH_CLIENT_SECRET}
      SELF_HOSTED: "true"
      RAILS_FORCE_SSL: "false"
      RAILS_ASSUME_SSL: "true"
      DB_HOST: sure-postgres
      DB_PORT: "5432"
      REDIS_URL: redis://sure-redis:6379/1
      APP_DOMAIN: sure.lkwplus.com
      WEBAUTHN_RP_ID: lkwplus.com
      WEBAUTHN_ALLOWED_ORIGINS: https://sure.lkwplus.com
      ONBOARDING_STATE: open
    dns:
      - 8.8.8.8
      - 1.1.1.1

  sure-worker:
    container_name: sure-worker
    image: ghcr.io/we-promise/sure:0.7.4
    command: bundle exec sidekiq
    restart: unless-stopped
    depends_on:
      sure-postgres:
        condition: service_healthy
      sure-redis:
        condition: service_healthy
    volumes:
      # Rails runs as uid 1000 in the image — chown the host dir before first deploy:
      #   chown 1000:1000 /srv/sure/storage
      - /srv/sure/storage:/rails/storage
    environment:
      POSTGRES_USER: sure_user
      POSTGRES_PASSWORD: ${SURE_POSTGRES_PASSWORD}
      POSTGRES_DB: sure_production
      SECRET_KEY_BASE: ${SURE_SECRET_KEY_BASE}
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${SURE_AR_ENC_PRIMARY_KEY}
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${SURE_AR_ENC_DETERMINISTIC_KEY}
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${SURE_AR_ENC_KEY_DERIVATION_SALT}
      SNAPTRADE_OAUTH_CLIENT_ID: ${SNAPTRADE_OAUTH_CLIENT_ID}
      SNAPTRADE_OAUTH_CLIENT_SECRET: ${SNAPTRADE_OAUTH_CLIENT_SECRET}
      SELF_HOSTED: "true"
      RAILS_FORCE_SSL: "false"
      RAILS_ASSUME_SSL: "true"
      DB_HOST: sure-postgres
      DB_PORT: "5432"
      REDIS_URL: redis://sure-redis:6379/1
      APP_DOMAIN: sure.lkwplus.com
      WEBAUTHN_RP_ID: lkwplus.com
      WEBAUTHN_ALLOWED_ORIGINS: https://sure.lkwplus.com
      ONBOARDING_STATE: open
    dns:
      - 8.8.8.8
      - 1.1.1.1

  sure-postgres:
    container_name: sure-postgres
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sure_user
      POSTGRES_PASSWORD: ${SURE_POSTGRES_PASSWORD}
      POSTGRES_DB: sure_production
    volumes:
      - /srv/sure/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sure_user -d sure_production"]
      interval: 30s
      timeout: 5s
      retries: 5

  sure-redis:
    container_name: sure-redis
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - /srv/sure/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  default:
    name: sure
