# magpie — model gateway for coding agents (https://usemagpie.ai/docs/docker), in gateway mode:
# providers, subscription logins, routing groups and per-client gateway keys, managed from a web UI.
# Runs on the arm host (Oracle-Arm, aarch64 — ghcr.io/yetone/magpie is multi-arch incl.
# linux/arm64), served by arm's host Caddy on ONE hostname, magpie.lkwplus.com:
#   /v1/*, /v1beta/*  -> gateway (127.0.0.1:20011)  OpenAI base …/v1, Anthropic/Gemini base the root
#   everything else   -> web UI  (127.0.0.1:20012)
#
# Two separate credentials:
# - Web UI: MAGPIE_WEB_KEY (Komodo Variable). Open https://magpie.lkwplus.com/?k=<key> once; the
#   key is swapped for a 400-day cookie. Anyone holding it can change magpie and read its keys.
# - Gateway: every request needs an enabled gateway key (Gateway → Gateway keys in the UI, or
#   `docker exec magpie /magpie gateway-key add "<client>"`); without one it answers 401.
#
# Process uid/gid 1002 = host user `agent` (same as dsh), instead of the image's nonroot 65532.
# /config holds everything (providers, keys, logins, plugins, usage) and is HOME inside the
# container, so /srv/magpie/config must be owned by 1002:1002.
services:
  magpie:
    container_name: magpie
    image: ghcr.io/yetone/magpie:0.1.1180
    restart: unless-stopped
    user: "1002:1002"
    command: ["web", "--addr", "0.0.0.0:3430", "--no-open"]
    ports:
      # host:container — arm registry (see docs/ports.md), loopback-only for the host Caddy
      - "127.0.0.1:20011:3425/tcp" # gateway
      - "127.0.0.1:20012:3430/tcp" # web UI
    volumes:
      - /srv/magpie/config:/config
    environment:
      TZ: Asia/Shanghai
      MAGPIE_WEB_KEY: ${MAGPIE_WEB_KEY}
      # The addresses magpie shows/prints: the gateway base and the page behind Caddy.
      MAGPIE_PUBLIC_URL: https://magpie.lkwplus.com
      MAGPIE_WEB_URL: https://magpie.lkwplus.com
    # The image ships its own HEALTHCHECK (`/magpie healthcheck`, gateway answering).

networks:
  default:
    name: magpie
