# ghostfolio — open source wealth management software (https://github.com/ghostfolio/ghostfolio).
# Runs on the arm host (Oracle-Arm, aarch64 — docker.io/ghostfolio/ghostfolio is multi-arch incl.
# linux/arm64), served by arm's host Caddy at ghostfolio.lkwplus.com. Only the app publishes a
# host port (127.0.0.1:20005); Postgres and Redis are internal-only.
#
# Upstream: docker/docker-compose.yml + .env.example. Two deltas from upstream: named volumes
# become absolute binds under /srv/ghostfolio/ (repo convention — Komodo re-clones the repo, data
# must live outside the clone), and the app sits behind TLS at the host Caddy, so ROOT_URL is the
# public https URL and TRUST_PROXY=1 makes Express read the real client IP for rate limiting.
#
# POSTGRES_PASSWORD / REDIS_PASSWORD / ACCESS_TOKEN_SALT / JWT_SECRET_KEY are Komodo Variables.
services:
  ghostfolio:
    container_name: ghostfolio
    image: ghostfolio/ghostfolio:3.72.0
    restart: unless-stopped
    init: true
    depends_on:
      ghostfolio-postgres:
        condition: service_healthy
      ghostfolio-redis:
        condition: service_healthy
    ports:
      # host:container — arm registry (see docs/ports.md), loopback-only for the host Caddy
      - "127.0.0.1:20005:3333/tcp"
    environment:
      ACCESS_TOKEN_SALT: ${GHOSTFOLIO_ACCESS_TOKEN_SALT}
      DATABASE_URL: postgresql://ghostfolio:${GHOSTFOLIO_POSTGRES_PASSWORD}@ghostfolio-postgres:5432/ghostfolio-db?connect_timeout=300
      JWT_SECRET_KEY: ${GHOSTFOLIO_JWT_SECRET_KEY}
      REDIS_HOST: ghostfolio-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${GHOSTFOLIO_REDIS_PASSWORD}
      ROOT_URL: https://ghostfolio.lkwplus.com
      TRUST_PROXY: "1"
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3333/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  ghostfolio-postgres:
    container_name: ghostfolio-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ghostfolio
      POSTGRES_PASSWORD: ${GHOSTFOLIO_POSTGRES_PASSWORD}
      POSTGRES_DB: ghostfolio-db
    volumes:
      - /srv/ghostfolio/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghostfolio -d ghostfolio-db"]
      interval: 10s
      timeout: 5s
      retries: 5

  ghostfolio-redis:
    container_name: ghostfolio-redis
    image: redis:7-alpine
    restart: unless-stopped
    # Ghostfolio always authenticates to Redis, so the server must require a password.
    command: ["redis-server", "--requirepass", "${GHOSTFOLIO_REDIS_PASSWORD}"]
    volumes:
      - /srv/ghostfolio/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --pass \"$$GHOSTFOLIO_REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      GHOSTFOLIO_REDIS_PASSWORD: ${GHOSTFOLIO_REDIS_PASSWORD}

networks:
  default:
    name: ghostfolio
