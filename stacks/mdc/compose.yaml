# mdc (Movie Data Capture): scraper that reads source files from the 115 mount
# (/mnt/CloudNAS/115, provided by the host-networked clouddrive2, seen here as /media/115) and writes
# nfo/poster/fanart into the shared Emby library (/srv/emby/data, mounted as /emby_data) for Emby to
# read directly. Its own config/state lives in /srv/mdc/data.
#
# flaresolverr solves Cloudflare challenges for the scrapers; mdc reaches it in-network at
# http://flaresolverr:8191/v1 (config.json) over this stack's `mdc` network. It is internal-only
# (container mdc-flaresolverr, no published host port) — only mdc uses it. Login creds are Komodo Variables.
services:
  mdc:
    container_name: mdc
    image: mdcng/mdc:v1.36.0
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
      - MDC_USERNAME=${MDC_USERNAME}
      - MDC_PASSWORD=${MDC_PASSWORD}
    volumes:
      - /srv/mdc/data:/config
      # Mount the plain parent dir, not the /mnt/CloudNAS/115 FUSE mountpoint itself: a bind of the
      # mountpoint is a snapshot, so a clouddrive2 remount leaves a dead mount here (empty dir /
      # ENOTCONN). rslave propagates clouddrive2's umount/mount into this namespace instead.
      # Paths in config.json are therefore /media/115/... — the host / is already `shared`.
      - /mnt/CloudNAS:/media:rslave
      - /srv/emby/data:/emby_data
    ports:
      # host:container — host port from the registry (see docs/ports.md)
      - "20024:9208/tcp"

  flaresolverr:
    container_name: mdc-flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - LOG_FILE=none
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=Asia/Shanghai
    volumes:
      - /srv/mdc/flaresolver:/config
    # mdc opens a new FlareSolverr session (a whole Chromium) on every start and never destroys the
    # old one, and its keepalive leaves each tab parked on a live site whose JS keeps spinning — so
    # idle usage creeps up across mdc restarts. Cap it; one healthy session sits around 1 GiB.
    # Clear leaked sessions with `sessions.list` / `sessions.destroy` (see docs/media.md).
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M

networks:
  default:
    name: mdc
