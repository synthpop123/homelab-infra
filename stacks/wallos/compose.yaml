services:
  wallos:
    container_name: wallos
    image: bellamy/wallos:5.11.1
    ports:
      # host:container — host port allocated from the registry (see docs/ports.md)
      - "20000:80/tcp"
    environment:
      TZ: Asia/Shanghai
    volumes:
      # Persistent data lives on the host under /srv/<service>/ (absolute paths,
      # so data never lands inside Komodo's git clone of this repo).
      - /srv/wallos/db:/var/www/html/db
      - /srv/wallos/logos:/var/www/html/images/uploads/logos
    restart: unless-stopped
    # The image's own probe, at this repo's interval.
    healthcheck:
      interval: 60s
      start_period: 60s
      start_interval: 5s

networks:
  # Name the project network explicitly to avoid the auto-generated "<project>_default".
  default:
    name: wallos
