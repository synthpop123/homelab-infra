# Emby media server. Sees the shared media library /srv/emby/data as /data (the STRM trees Muvyo
# and Amane write). Emby's own config/database lives in /srv/emby/config.
#
# It only holds the 电影/电视剧 libraries now, and those are frozen (no monitor, no scheduled scan,
# never scan them by hand): Vyo imported them and proxies their artwork live from here —
# docs/media.md. JAV/Porn are watched in Plex; Emby has no library on those trees.
#
# Stays on the external mediacenter-net at the FIXED IP 172.22.0.4: Muvyo reaches Emby by address
# (stacks/muvyo), as did the stopped cloud-media-sync (EMBY_HOST_PORT=http://172.22.0.4:8096), so
# the IP must not change. The network is created/managed outside this repo (manual `docker network create`),
# hence external.
services:
  emby:
    container_name: emby
    image: linuxserver/emby:4.10.1.0-ls301
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
    volumes:
      - /srv/emby/config:/config
      - /srv/emby/data:/data
      - /srv/emby/mediainfo:/mediainfo
    ports:
      # host:container — host port from the registry (see docs/ports.md)
      - "20021:8096/tcp"
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      mediacenter-net:
        ipv4_address: 172.22.0.4

networks:
  mediacenter-net:
    external: true
    name: mediacenter-net
