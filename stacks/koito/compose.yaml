services:
  koito:
    container_name: koito
    image: gabehf/koito:v0.3.2
    ports:
      # host:container — host port from the registry (see docs/ports.md)
      - "20005:4110/tcp"
    environment:
      KOITO_FORCE_TZ: Asia/Shanghai
      KOITO_CORS_ALLOWED_ORIGINS: https://lkwplus.com,http://localhost:4321
      # Secret injected from a Komodo Variable at deploy time.
      KOITO_LASTFM_API_KEY: ${KOITO_LASTFM_API_KEY}
      # Cover resizing uses h2non/bimg -> libvips: C allocations are outside Go's memory limit.
      # Limit glibc arenas and use a fixed mmap threshold to reduce retained image buffers.
      # These controls complement the host THP collapse limits; neither guarantees lower RSS.
      MALLOC_ARENA_MAX: "2"
      MALLOC_MMAP_THRESHOLD_: "131072"
      MALLOC_TRIM_THRESHOLD_: "131072"
      # Keep the existing Go memory budget for import/backfill work.
      GOMEMLIMIT: 512MiB
      GODEBUG: disablethp=1
    volumes:
      # koito keeps its SQLite DB + image cache here (runs as root).
      - /srv/koito/koito:/etc/koito
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4110 && printf 'GET /apis/web/v1/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s

  # Pulls listens from Spotify etc. and scrobbles them to koito over the internal network,
  # so the two ship as one stack. multi-scrobbler reaches koito at http://koito:4110.
  multi-scrobbler:
    container_name: multi-scrobbler
    image: foxxmd/multi-scrobbler:0.21.0
    depends_on:
      - koito
    ports:
      - "20006:9078/tcp"
    environment:
      TZ: Asia/Shanghai
      SPOTIFY_ID: spotify
      SPOTIFY_NAME: Spotify
      KOITO_ID: koito
      KOITO_URL: http://koito:4110
      KOITO_NAME: Koito
      # Public base URL, username and Spotify/koito credentials come from Komodo Variables
      # (kept out of git — the repo is open-source-bound).
      BASE_URL: ${MS_BASE_URL}
      SPOTIFY_REDIRECT_URI: ${MS_BASE_URL}/callback
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      KOITO_TOKEN: ${KOITO_TOKEN}
      KOITO_USER: ${KOITO_USER}
      # 0.21.0+ built-in dashboard/API auth. Both are only read while the admin has no
      # password / is first created, and ignored afterwards (both from Komodo Variables).
      # Ingress endpoints and outbound scrobbles to koito are not affected by auth.
      ADMIN_SETUP_USER: ${MS_ADMIN_SETUP_USER}
      ADMIN_SETUP_PW: ${MS_ADMIN_SETUP_PW}
    volumes:
      - /srv/koito/config:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:9078/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s

networks:
  # Name the project network explicitly to avoid the auto-generated "<project>_default".
  default:
    name: koito
