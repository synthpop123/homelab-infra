# DeepSeek Harness (dsh) Web UI — installed from upstream's npm package (see Dockerfile).
# Runs on the arm host (Oracle-Arm, aarch64) behind the host Caddy at dsh.lkwplus.com.
# Host networking is required: dsh web listens on 127.0.0.1 only (upstream rejects
# --host 0.0.0.0), so a bridge publish would not reach the process.
#
# dsh has NO authentication and its default agent preset carries tool-bash/tool-fs, so the
# Caddy vhost on arm gates dsh.lkwplus.com with basic_auth. Never expose this origin without
# that gate — the credentials live in /etc/caddy/Caddyfile, off git (this repo is public).
#
# Process uid/gid 1002 matches host user `agent` (same pattern as multica's tooling user).
# DSH_HOME holds profiles, credentials, and session state; /workspaces is the default
# workspace root (add project dirs under /srv/dsh/workspaces on the host).
services:
  dsh:
    container_name: dsh
    # Built locally from ./Dockerfile; the stack deploys with `--build` (see komodo/sync.toml).
    # Deliberately no `image:` — same as autobrr-notify and letterboxd-plex-sync. Komodo's
    # auto_pull runs `compose pull` first, which would try to fetch a locally-built tag from a
    # registry and abort the deploy ("pull access denied for dsh"). Without the key, compose
    # names it dsh-dsh and pull skips the service; the running version is on the image's
    # org.opencontainers.image.version label.
    build:
      context: .
      args:
        # The version pin lives HERE, not in the Dockerfile, and that placement is what makes
        # upgrades self-deploying: `file_paths` in komodo/sync.toml is compose-only, so only a
        # change to THIS file gets picked by BatchDeployStackIfChanged. Renovate rewrites the
        # line below (via the `customManagers` regex entry in renovate.json), and merging that PR
        # both syncs and redeploys with `--build`. Upstream is a developer preview shipping
        # 0.1.0-rc.N, so its releases are semver-unstable — renovate.json disables
        # ignoreUnstable for this package, otherwise a jump to a new minor's rc line (the
        # 0.0.1-rc.5 -> 0.1.0-rc.2 kind, which has already happened once) would be dropped in
        # silence. Read the release notes before merging: breaking changes are expected here.
        # renovate: datasource=npm depName=@deepseek-ai/dsh
        DSH_VERSION: "0.1.0-rc.8"
    restart: unless-stopped
    network_mode: host
    user: "1002:1002"
    working_dir: /workspaces
    environment:
      TZ: Asia/Shanghai
      DSH_HOME: /data
      # Optional fallback; the Web UI can also store keys in $DSH_HOME/.credentials.yaml.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - /srv/dsh/data:/data
      - /srv/dsh/workspaces:/workspaces
