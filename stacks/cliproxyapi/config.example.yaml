# Example config for cli-proxy-api (CLIProxyAPI / CPA v8), from Oh My CPA's cpa.config.example.yaml.
#
# The REAL file is NOT committed — it carries the client api-keys — and lives on the host at
# /srv/cliproxyapi/config.yaml (bind-mounted, backed up with /srv). Copy this file there and fill in
# real values before the first deploy. It must exist as a FILE, or Docker creates a directory at
# that path.
#
# Providers/accounts (Gemini, Codex, Claude, OpenAI-compatible, …) and api-keys are best managed
# through Oh My CPA at https://cpa.lkwplus.com/omc/ (it edits this config and uploads OAuth auth
# files for you). Full provider reference:
#   https://github.com/router-for-me/CLIProxyAPI/blob/main/config.example.yaml
config-version: 8
server:
  # Bind all interfaces inside the container (the host firewall + Akko gate external access).
  host: ""
  port: 8317
management:
  # OMC is a remote client to CPA (another container), so remote management must be on.
  allow-remote: true
  # Empty: the MANAGEMENT_PASSWORD env (Komodo Variable CPA_MANAGEMENT_KEY) supplies the key.
  secret-key: ""
  # The built-in /management.html is replaced by OMC.
  disable-control-panel: true
access:
  # API keys clients must present to call the AI proxy at https://cpa.lkwplus.com (/v1/*).
  api-keys:
    - "CHANGE_ME_client_api_key"
oauth:
  auth-dir: /root/.cli-proxy-api
observability:
  logs:
    # Write app logs to rotating files under /CLIProxyAPI/logs (/srv/cliproxyapi/logs) instead of
    # stdout only — OMC's 日志查看 page reads them through the management API; without this it
    # shows "CPA 未开启文件日志". Hot-reloaded, no restart needed.
    logging-to-file: true
    logs-max-total-size-mb: 512
  usage:
    # OMC collects usage from CPA's queue; retention bounds its poll interval.
    usage-statistics-enabled: true
    redis-usage-queue-retention-seconds: 60
plugins:
  enabled: false
  dir: /CLIProxyAPI/plugins
